apiVersion: v1
kind: Service
metadata:
  name: museum-core
  namespace: museum
spec:
  selector:
    app: museum-core
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: museum-users
  namespace: museum
spec:
  selector:
    app: museum-users
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: museum-web
  namespace: museum
spec:
  type: NodePort
  selector:
    app: museum-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
